# Vérifications sur les branches de travail et les pull requests (sans publication).
name: Vérifications

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npx playwright install-deps chromium
        timeout-minutes: 4
        continue-on-error: true
      - run: npm run e2e
        timeout-minutes: 15
