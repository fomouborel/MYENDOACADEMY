# Couche 2 – Intégration et déploiement automatiques.
# À chaque push sur main (ou lancement manuel) : installation, vérification TypeScript,
# validation du contenu, tests unitaires, construction, tests de bout en bout, puis publication
# sur GitHub Pages. Si une étape échoue, rien n'est publié : la version en ligne reste la précédente.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales : lecture du code, écriture Pages, jeton OIDC pour le déploiement.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Limites de temps : une étape bloquée échoue vite (sinon 6 h par défaut) ; la version en ligne reste la précédente.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Validation du contenu (questions, leçons, identifiants)
        run: npm run validate:content
      - name: Tests unitaires
        run: npm test
      - name: Construction
        run: npm run build
      # Le navigateur vient du serveur de Playwright. Les dépendances système passent par le miroir
      # Ubuntu, parfois indisponible : l'étape est tentée à part, sans bloquer (l'image GitHub contient
      # déjà Chrome et ses bibliothèques). S'il manquait vraiment quelque chose, les tests échoueraient.
      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install chromium
        timeout-minutes: 5
      - name: Dépendances système du navigateur (facultatif)
        run: npx playwright install-deps chromium
        timeout-minutes: 4
        continue-on-error: true
      - name: Tests de bout en bout (ordinateur + smartphone)
        run: npm run e2e
        timeout-minutes: 15
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
